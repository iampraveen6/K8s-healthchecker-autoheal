apiVersion: v1
kind: Secret
metadata:
  name: slabai-secrets
  namespace: slabai
type: Opaque
stringData:
  # Userservice
  USERSERVICE_MONGO_URI: "mongodb://REPLACE_WITH_DB_USER:REPLACE_WITH_DB_PASSWORD@mongodb.slabai.svc.cluster.local:27017/k8s-slabai"
  USERSERVICE_PORT: "3000"
  USERSERVICE_RAZORPAY_KEY_ID: "REPLACE_WITH_RAZORPAY_KEY_ID"
  USERSERVICE_RAZORPAY_KEY_SECRET: "REPLACE_WITH_RAZORPAY_KEY_SECRET"
  USERSERVICE_AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
  USERSERVICE_AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  USERSERVICE_AWS_REGION: "us-west-2"
  USERSERVICE_S3_BUCKET_NAME: "k8s-slabai"
  USERSERVICE_DOWNLOAD_URL: "http://localhost:3000"

  # Projectservice
  PROJECTSERVICE_MONGO_URI: "mongodb://REPLACE_WITH_DB_USER:REPLACE_WITH_DB_PASSWORD@mongodb.slabai.svc.cluster.local:27017/k8s-slabai"
  PROJECTSERVICE_PORT: "3001"
  PROJECTSERVICE_RAZORPAY_KEY_ID: "REPLACE_WITH_RAZORPAY_KEY_ID"
  PROJECTSERVICE_RAZORPAY_KEY_SECRET: "REPLACE_WITH_RAZORPAY_KEY_SECRET"
  PROJECTSERVICE_AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
  PROJECTSERVICE_AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  PROJECTSERVICE_AWS_REGION: "us-west-2"
  PROJECTSERVICE_S3_BUCKET_NAME: "k8s-slabai"
  PROJECTSERVICE_DOWNLOAD_URL: "http://localhost:3001"

  # Paymentservice
  PAYMENTSERVICE_MONGO_URI: "mongodb://REPLACE_WITH_DB_USER:REPLACE_WITH_DB_PASSWORD@mongodb.slabai.svc.cluster.local:27017/k8s-slabai"
  PAYMENTSERVICE_PORT: "3002"
  PAYMENTSERVICE_RAZORPAY_KEY_ID: "REPLACE_WITH_RAZORPAY_KEY_ID"
  PAYMENTSERVICE_RAZORPAY_KEY_SECRET: "REPLACE_WITH_RAZORPAY_KEY_SECRET"
  PAYMENTSERVICE_AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
  PAYMENTSERVICE_AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  PAYMENTSERVICE_AWS_REGION: "us-west-2"
  PAYMENTSERVICE_S3_BUCKET_NAME: "k8s-slabai"
  PAYMENTSERVICE_DOWNLOAD_URL: "http://localhost:3002"